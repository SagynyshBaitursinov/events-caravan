name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Grant Docker socket access to floci
        run: sudo chmod 666 /var/run/docker.sock

      - name: Run local test suite
        run: ./local/test
