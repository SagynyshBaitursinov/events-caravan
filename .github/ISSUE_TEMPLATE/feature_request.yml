name: Feature request
description: Propose a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case or limitation you are hitting, not only the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you imagine this working? API sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: philosophy
    attributes:
      label: Fit with the project philosophy
      description: >
        How does the proposal fit the project's principles (horizontal scalability, simple and cheap
        technology features, one write destination per operation, eventual consistency)? See the
        "Philosophy in principles" section of the README.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
