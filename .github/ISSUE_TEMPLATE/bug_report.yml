name: Bug report
description: Report something that doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including the full error message or stack trace if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: >
        Minimal steps or a code snippet that reproduces the problem. Event/entity definitions,
        configuration properties, and infrastructure setup (DynamoDB/SNS/SQS or custom adapters) are
        often the key details.
      placeholder: |
        1. Define an entity ...
        2. Publish event ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Events Caravan version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Java version, Spring Boot version, which adapter modules are in use, and whether it runs against real AWS or an emulator.
      placeholder: |
        Java: 25
        Spring Boot: 4.x
        Modules: events-caravan-dynamodb, events-caravan-sqs
        Infrastructure: AWS / floci
    validations:
      required: false
