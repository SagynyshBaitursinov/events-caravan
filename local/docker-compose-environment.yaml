services:
  ministack:
    container_name: ministack
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
    environment:
      - MINISTACK_REGION=us-east-1
      - LAMBDA_EXECUTOR=docker
      - DOCKER_NETWORK=ministack-net
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - ministack-net

networks:
  ministack-net:
    name: ministack-net
