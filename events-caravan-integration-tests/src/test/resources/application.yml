app:
  name: test-app

spring:
  application:
    name: ${app.name}

caravan:
  event:
    sourcing:
      snapshot-store:
        dynamo-db:
          table-name: ${app.name}_snapshots
          consistent-read: false
    store:
      dynamo-db:
        table-name: ${app.name}_events
        query-max-page-size: 5
        partition-shard-size: 10
        consistent-read: false
    messaging:
      queue-name-prefix: ${app.name}
      subscribed-entities:
        - calculator
        - test-entity
        - number-addition-request
      graceful-shutdown-seconds: 0
      concurrency: 20
      max-poll-size: 10
      min-poll-size: 3
      poll-wait-seconds: 5
      deletion:
        max-batch-size: 10
        period-seconds: 1
        concurrency: 2
